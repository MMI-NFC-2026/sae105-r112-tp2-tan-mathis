<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil | TP liens relatifs</title>
   <!-- Lien relatif : depuis ce fichier vers src/css/styles.css -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="header header--home">

    <!--
      popovertarget relie le bouton au menu grâce à son id. Le popover "auto"
      s'ouvre et se ferme sans JavaScript ; Échap ou un clic à l'extérieur
      permettent aussi de le fermer.
      MDN : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Elements/button#popovertarget
      MDN : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Global_attributes/popover
    -->
    <button class="burger" type="button" popovertarget="menu" aria-label="Menu">
      🍔
    </button>

    <!--
      L'attribut popover masque le menu tant qu'il n'est pas ouvert. Son id
      unique permet aux boutons de le cibler ; ouvert, il apparaît dans la
      couche supérieure du navigateur.
      MDN : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Global_attributes/popover
    -->
    <nav class="menu" id="menu" popover aria-label="Menu Principal">
      <!--
        popovertargetaction="hide" ferme explicitement le menu. autofocus
        place le focus sur ce bouton à l'ouverture du popover.
        MDN : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Elements/button#popovertargetaction
        MDN : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Global_attributes/autofocus
      -->
      <button
        class="menu__close burger burger--close"
        type="button"
        popovertarget="menu"
        popovertargetaction="hide"
        aria-label="Fermer le menu"
        autofocus
      >
        🍔
      </button>
       <h4>Menu</h4>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li>
          <a href="cats/index.html">Chats</a>
          <ul>
            <li><a href="cats/chat-1.html">chat-1</a></li>
            <li><a href="cats/chat-2.html">chat-2</a></li>
          </ul>
        </li>
        <li>
          <a href="dogs/index.html">Chiens</a>
          <ul>
            <li><a href="dogs/chien-1.html">chien-1</a></li>
            <li><a href="dogs/chien-2.html">chien-2</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Chats et chiens</h1>
    <p>Bienvenue ! Ce site sert à pratiquer les liens relatifs entre fichiers.</p>
    <ul>
      <li><a href="cats/index.html">Voir les chats</a></li>
      <li><a href="dogs/index.html">Voir les chiens</a></li>
    </ul>
  </main>
</body>

</html>
